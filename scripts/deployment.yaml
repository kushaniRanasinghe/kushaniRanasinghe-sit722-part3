        - name: DATABASE_URL
          value: "postgresql://sit722_kushani_part3_user:E0oUabnec3IjAamuHg5NaRCV1BvHupyw@dpg-crci542j1k6c73cmjlj0-a.oregon-postgres.render.com/sit722_kushani_part3"


