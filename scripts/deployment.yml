# Book Catalog Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-catalog
  template:
    metadata:
      labels:
        app: book-catalog
    spec:
      containers:
      - name: book-catalog
        image: registrykushani722part3.azurecr.io/book-catalog:1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8087
        env:
        - name: DATABASE_URL
          value: "postgresql://sit722_kushani_part3_user:E0oUabnec3IjAamuHg5NaRCV1BvHupyw@dpg-crci542j1k6c73cmjlj0-a.oregon-postgres.render.com/sit722_kushani_part3"

---
# Book Catalog Service
apiVersion: v1
kind: Service
metadata:
  name: book-catalog
spec:
  selector:
    app: book-catalog
  type: LoadBalancer
  ports:
    - port: 8087 
      targetPort: 8087 

